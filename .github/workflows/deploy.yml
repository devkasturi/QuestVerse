name: Deploy QuestVerse to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trailmate/package-lock.json

      - name: Install dependencies
        working-directory: trailmate
        run: npm ci

      - name: Build project
        working-directory: trailmate
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload production build
        uses: actions/upload-pages-artifact@v3
        with:
          path: trailmate/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
